# Cấu hình trang quản trị (Sveltia CMS) – xem HUONG-DAN.md
backend:
  name: github
  repo: TAI-KHOAN-GITHUB/TEN-REPO # Sửa thành <tài-khoản>/<tên-repo>
  branch: main
  # Địa chỉ Sveltia CMS Authenticator đã cài trên Cloudflare Workers
  base_url: https://TEN-WORKER.TAI-KHOAN.workers.dev

logo_url: /icon-192.png

# Ảnh tải lên được tự thu nhỏ và chuyển sang WebP ngay trên máy, trước khi lưu
# Thư mục ảnh chung (mỗi mục bên dưới có thư mục ảnh riêng)
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 20000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: products
    label: Sản phẩm
    label_singular: sản phẩm
    description: Mỗi mục là một mẫu sản phẩm trên web. Tắt "Hiển thị trên web" để ẩn tạm thời.
    folder: src/content/products
    extension: md
    format: frontmatter
    create: true
    slug: "{{name}}"
    identifier_field: name
    media_folder: ../../assets/products
    public_folder: ../../assets/products
    summary: "{{name}} · {{status}}{{banner | ternary(' · Banner', '')}}{{featured | ternary(' · ★ Nổi bật', '')}}{{visible | ternary('', ' · (đang ẩn)')}}"
    sortable_fields: [order, name, category]
    view_filters:
      - { label: Trên banner lớn, field: banner, pattern: true }
      - { label: Sản phẩm nổi bật, field: featured, pattern: true }
      - { label: Đang ẩn, field: visible, pattern: false }
    view_groups:
      - { label: Danh mục, field: category }
    fields:
      - { label: Tên sản phẩm, name: name, widget: string }
      - label: Danh mục
        name: category
        widget: select
        options:
          - { label: Bàn thờ & án gian, value: ban-tho }
          - { label: Hoành phi, câu đối, value: hoanh-phi }
          - { label: Bàn ghế & sofa, value: ban-ghe }
          - { label: Giường, tủ & bàn trang điểm, value: giuong-tu }
          - { label: Tượng & mỹ nghệ, value: my-nghe }
      - label: Tình trạng
        name: status
        widget: select
        default: dat-lam
        options:
          - { label: Nhận đặt làm, value: dat-lam }
          - { label: Có sẵn, value: co-san }
          - { label: Mẫu trưng bày tại cửa hàng, value: trung-bay }
      - label: Ảnh
        name: images
        widget: image
        multiple: true
        required: false
        hint: Ảnh đầu tiên là ảnh đại diện. Nên chụp ảnh ngang, đủ sáng. Ảnh được tự thu nhỏ khi tải lên.
      - { label: Chất liệu, name: material, widget: string, required: false, hint: Để trống nếu chưa muốn ghi }
      - { label: Kích thước, name: size, widget: string, required: false }
      - { label: Giá, name: price, widget: string, required: false, hint: Để trống sẽ hiện "Liên hệ báo giá" }
      - { label: Mô tả, name: body, widget: markdown, required: false, buttons: [bold, italic, bulleted-list], editor_components: [], hint: Để trống một dòng giữa các đoạn }
      - { label: Hiện trên banner lớn đầu trang, name: banner, widget: boolean, default: false, hint: "Chọn 3–4 mẫu có ảnh ngang, đẹp nhất. Ảnh đầu tiên làm nền banner." }
      - { label: Sản phẩm nổi bật, name: featured, widget: boolean, default: false, hint: "Hiện trong dải Sản phẩm nổi bật trên trang chủ. Nên chọn khoảng 5 mẫu." }
      - { label: Hiển thị trên web, name: visible, widget: boolean, default: true }
      - { label: Thứ tự hiển thị, name: order, widget: number, value_type: int, required: false, hint: Số nhỏ hiện trước. Để trống sẽ xếp cuối. }

  - name: settings
    label: Thông tin cửa hàng
    files:
      - name: site
        label: Thông tin chung
        file: src/content/settings/site.json
        media_folder: ../../assets/site
        public_folder: ../../assets/site
        fields:
          - { label: Tên thương hiệu, name: brand, widget: string }
          - { label: Dòng mô tả dưới tên, name: tagline, widget: string, required: false }
          - { label: Câu giới thiệu chính, name: intro_title, widget: string, hint: Dùng cho Google và khi chưa có sản phẩm nổi bật }
          - { label: Đoạn giới thiệu ngắn, name: intro_text, widget: text }
          - { label: Tiêu đề phần Về chúng tôi, name: story_title, widget: string }
          - { label: Nội dung phần Về chúng tôi, name: story_text, widget: text, hint: Để trống một dòng giữa các đoạn }
          - { label: Ảnh phần Về chúng tôi, name: story_image, widget: image, required: false }
          - label: Ảnh cửa hàng & xưởng
            name: gallery
            widget: list
            label_singular: ảnh
            summary: "{{caption}}"
            hint: Ảnh thật tại cửa hàng, xưởng. Ảnh đầu tiên hiện to nhất.
            fields:
              - { label: Ảnh, name: image, widget: image, required: false }
              - { label: Chú thích, name: caption, widget: string, required: false }
          - { label: Số điện thoại, name: phone, widget: string }
          - { label: Số Zalo (chỉ chữ số), name: zalo, widget: string, required: false, hint: Để trống sẽ dùng số điện thoại }
          - { label: Link Messenger, name: messenger, widget: string, required: false, hint: "VD: https://m.me/ten-trang. Để trống sẽ ẩn nút Messenger." }
          - { label: Link trang Facebook, name: facebook, widget: string, required: false }
          - { label: Địa chỉ cửa hàng, name: address, widget: string }
          - { label: Giờ mở cửa, name: hours, widget: string, required: false }
          - { label: Link Google Maps (nút Chỉ đường), name: maps_url, widget: string, required: false, hint: Mở Google Maps → tìm cửa hàng → Chia sẻ → Sao chép đường liên kết }
          - { label: Mã nhúng bản đồ, name: maps_embed, widget: text, required: false, hint: Google Maps → Chia sẻ → Nhúng bản đồ → Sao chép HTML rồi dán vào đây. Để trống sẽ tự dùng địa chỉ. }
          - { label: Mã nhận form (Web3Forms), name: form_key, widget: string, required: false, hint: Lấy miễn phí tại web3forms.com bằng email cửa hàng. Để trống thì form sẽ nhắc khách gọi điện. }
